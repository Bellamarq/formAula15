<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro do Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
 
  <div class="container mt-4">
    <h4>Cadastro do cliente</h4>
 
    <div id="mensagem-erro" class="d-none">
      CEP não encontrado. Verifique e tente novamente.
    </div>
 
    <form id="meuFormulario">
      <div class="row g-3">
 
        <div class="col-md-12">
          <label>Nome</label>
          <input type="text" id="nome" class="form-control" placeholder="Nome completo">
        </div>
 
        <div class="col-md-8">
          <label>Email</label>
          <input type="email" id="email" class="form-control">
        </div>
 
        <div class="col-md-4">
          <label>Telefone</label>
          <input type="text" id="telefone" class="form-control">
        </div>
 
        <div class="col-md-3">
          <label>CEP</label>
          <!-- Atributo 'maxlength' corrigido -->
          <input type="text" id="cep" class="form-control" maxlength="9">
        </div>
 
        <div class="col-md-7">
          <label>Logradouro</label>
          <input type="text" id="logradouro" class="form-control">
        </div>
 
        <div class="col-md-2">
          <label>Número</label>
          <input type="text" id="numero" class="form-control">
        </div>
 
        <div class="col-md-4">
          <label>Complemento</label>
          <input type="text" id="complemento" class="form-control">
        </div>
 
        <div class="col-md-4">
          <label>Bairro</label>
          <input type="text" id="bairro" class="form-control">
        </div>
 
        <div class="col-md-3">
          <label>Cidade</label>
          <input type="text" id="cidade" class="form-control">
        </div>
 
        <div class="col-md-1">
          <label>Estado</label>
          <input type="text" id="estado" class="form-control">
        </div>
 
        <div class="col-md-12">
          <button type="button" id="btn-limpar">Limpar</button>
        </div>
 
      </div>
    </form>
  </div>
 
  <script src="./script.js"></script>
</body>
</html>
